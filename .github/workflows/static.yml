name: Deploy static content to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  NODE_VERSION: 22.21.1
  NPM_VERSION: 10.9.4

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Checkout code
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - run: |
          pnpm -v
          node -v
          npm -v
          pnpm install --frozen-lockfile
          pnpm run build
          cd packages/engine-website-app/dist
          mkdir documents
          cp -r ../../docs-app/dist/* ./documents

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: 'packages/engine-website-app/dist'

  deploy:
    runs-on: ubuntu-latest
    needs: build # Ensure deployment happens after build
    permissions: write-all
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Setup Pages
        uses: actions/configure-pages@v2

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Publish to npm
        run: pnpm run toFastPublish -- --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
